[project]
name = "rich-color-ext"
description = "Extend Rich with the ability to parse CSS color names and 3-digit hex colors."
readme = "README.md"
authors = [{ name = "Max Ludden", email = "dev@maxludden.com" }]
requires-python = ">=3.10"
dynamic = ["version"]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
keywords = ["rich", "color", "css", "hex", "3-digit hex", "color names"]
dependencies = [
    "loguru>=0.7.3",
    "rich>=14.0.0",
]

[project.scripts]
rich-color-ext = "rich_color_ext.cli:main"
rich-color = "rich_color_ext.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=1.19.0",
    "mypy>=1.18.2",
    "pre-commit>=4.0.0",
    "pytest>=8.4.0",
    "ruff>=0.14.0",
]

[tool.hatch.version]
path = "src/rich_color_ext/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "S",   # flake8-bandit (basic security lint)
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line length is enforced by the formatter, not worth double-policing
]

[tool.ruff.lint.isort]
known-first-party = ["rich_color_ext"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately use assert, subprocess, etc. — bandit-style checks aren't
# meaningful there.
"tests/*" = ["S"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "loguru.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test suite is exercised by pytest, not consumed as a typed API surface —
# don't force full strict annotations on every helper/test function.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

